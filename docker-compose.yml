services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      KHB_ENV: ${KHB_ENV:-development}
      KHB_JWT_SECRET: ${KHB_JWT_SECRET:?Set KHB_JWT_SECRET in .env}
      KHB_JWT_TTL: ${KHB_JWT_TTL:-86400}
      KHB_CORS_ORIGINS: ${KHB_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      KHB_DATA_DIR: /app/data
      KHB_UPLOAD_DIR: /app/uploads
      KHB_MAX_UPLOAD_BYTES: ${KHB_MAX_UPLOAD_BYTES:-10485760}
      KHB_DEV_OTP: ${KHB_DEV_OTP:-}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
