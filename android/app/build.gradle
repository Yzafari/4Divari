plugins { id 'com.android.application' }

android {
    namespace 'ir.khanehbekhaneh.app'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'ir.khanehbekhaneh.app'
        minSdk 24
        targetSdk 36
        versionCode 702
        versionName '0.7.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            def apiBase = project.findProperty('KHB_API_BASE') ?: ''
            buildConfigField 'String', 'KHB_API_BASE', '"' + apiBase.replace('"', '\\"') + '"'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            def apiBase = project.findProperty('KHB_DEBUG_API_BASE') ?: 'http://localhost:8000'
            buildConfigField 'String', 'KHB_API_BASE', '"' + apiBase.replace('"', '\\"') + '"'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.17.1'
}
